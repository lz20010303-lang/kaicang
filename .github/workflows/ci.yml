name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1

jobs:
  swift-tests:
    name: Swift tests
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcodebuild -version
          swift --version
      - name: ControllerCore tests
        working-directory: app/ControllerCore
        run: swift test

  macos-build:
    name: macOS build
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Regenerate project
        working-directory: app
        run: xcodegen generate
      - name: Build OpenController-macOS
        working-directory: app
        run: |
          set -o pipefail
          xcodebuild \
            -project OpenController.xcodeproj \
            -scheme OpenController-macOS \
            -destination 'platform=macOS' \
            -configuration Debug \
            build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ENABLE_HARDENED_RUNTIME=NO \
            | xcbeautify

  ios-build:
    name: iOS build
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Regenerate project
        working-directory: app
        run: xcodegen generate
      - name: Build OpenController-iOS
        working-directory: app
        run: |
          set -o pipefail
          xcodebuild \
            -project OpenController.xcodeproj \
            -scheme OpenController-iOS \
            -destination 'generic/platform=iOS Simulator' \
            -sdk iphonesimulator \
            -configuration Debug \
            build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | xcbeautify

  web-tests:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install and test
        working-directory: web
        run: |
          python -m pip install -r requirements.txt
          python -m pytest
