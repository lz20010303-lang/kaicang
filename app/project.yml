# XcodeGen 工程描述。仓库里已附带生成好的 OpenController.xcodeproj，直接双击打开即可；
# 改了这个文件才需要重新生成：brew install xcodegen && xcodegen generate
name: OpenController
options:
  deploymentTarget:
    iOS: "16.0"
    macOS: "13.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
packages:
  ControllerCore:
    path: ControllerCore
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: 开仓控制器
    INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.finance
targets:
  OpenController-iOS:
    type: application
    platform: iOS
    sources:
      - path: App/Shared
    dependencies:
      - package: ControllerCore
    settings:
      base:
        PRODUCT_NAME: OpenController
        PRODUCT_BUNDLE_IDENTIFIER: $(OC_BUNDLE_PREFIX).ios
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
  OpenController-macOS:
    type: application
    platform: macOS
    sources:
      - path: App/Shared
    dependencies:
      - package: ControllerCore
    settings:
      base:
        PRODUCT_NAME: OpenController
        PRODUCT_BUNDLE_IDENTIFIER: $(OC_BUNDLE_PREFIX).mac
        CODE_SIGN_ENTITLEMENTS: App/macOS/OpenController.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
schemes:
  OpenController-iOS:
    build:
      targets:
        OpenController-iOS: all
    run:
      config: Debug
  OpenController-macOS:
    build:
      targets:
        OpenController-macOS: all
    run:
      config: Debug
